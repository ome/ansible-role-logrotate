---
# Configure sudo

- name: system packages | install logrotate
  become: true
  ansible.builtin.dnf:
    pkg: logrotate
    state: present

- name: logrotate | configure main file
  become: true
  ansible.builtin.template:
    backup: true
    dest: /etc/logrotate.conf
    src: logrotate.conf.j2
    mode: 0644
